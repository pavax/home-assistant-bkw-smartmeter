# Home Assistant for local verification of custom_components/bkw_smartmeter.
# Paths are relative to this file (scripts/mybkw-verification/).
name: mybkw-verification

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: bkw-smartmeter-ha-verify
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      TZ: Europe/Zurich
    volumes:
      - ./config:/config
      - ../../custom_components/bkw_smartmeter:/config/custom_components/bkw_smartmeter:ro
